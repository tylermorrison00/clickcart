name: Rename click-cart to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "tylermorrison00"
          git config user.email "tylermorrison00@users.noreply.github.com"
          if [ -f click-cart.html ]; then git mv click-cart.html index.html; fi
          git add -A
          git commit -m "Rename click-cart.html to index.html" || echo "nothing to commit"
          git push
